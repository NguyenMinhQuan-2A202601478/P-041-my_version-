# Python project configuration for CV Assistant (my_version).
# Ruff configuration lives in ruff.toml (kept separate so it stays the single
# source of truth — Ruff ignores [tool.ruff] here when ruff.toml is present).

[project]
name = "cv-assistant"
version = "0.1.0"
description = "AI agent toi uu CV theo JD (Gap Analysis) va phong van thu cham theo rubric STAR."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    # Optional LLM providers behind the LLM_PROVIDER switch in src/services/llm.py.
    # Kept as hard dependencies (not extras) so `agent_ai` code can import them
    # directly without try/except-ImportError branches everywhere.
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "qdrant-client>=1.15.0,<2.0.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    # CV/JD document parsing (PDF + DOCX) for src/services/cv_parser.py.
    "pypdf>=6.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
    # Needed for the CI type-check job (not in the original task list, added
    # because Step 5 requires a type-check job to run against something).
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
